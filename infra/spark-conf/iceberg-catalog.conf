# Iceberg Hadoop catalog + S3A properties for the TFM lakehouse (issue #92).
#
# Consumed by issue #93's spark-submit invocations, e.g.:
#   spark-submit --properties-file infra/spark-conf/iceberg-catalog.conf ...
#
# Credentials are deliberately NOT set here as literal values.
# fs.s3a.aws.credentials.provider is EnvironmentVariableCredentialsProvider,
# and the spark.kubernetes.executor.secretKeyRef.* property below tells
# spark-submit to mount the existing minio-root-credentials Kubernetes
# Secret's keys (created in issue #91) as AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY env vars on executor pod specs -- no new secret,
# nothing committed to git. There is deliberately no driver-side
# secretKeyRef property here: in the client deploy mode this cluster uses
# (see "Deploy mode" in README.md), Spark never builds a driver pod spec
# itself, so spark.kubernetes.driver.* pod-spec properties are no-ops --
# confirmed the hard way in issue #93's Task 8 (driver silently ran with
# no credentials until this was found). The driver IS whatever pod runs
# spark-submit, so its credentials are wired directly on that pod's own
# spec instead (see dags/issue93_spark_iceberg_smoke_test.py).

spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type=hadoop
spark.sql.catalog.lakehouse.warehouse=s3a://lakehouse/warehouse
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# MinIO Service confirmed live in the tfm-lakehouse namespace (issue #92
# Task 2): Service name "minio", port 9000.
spark.hadoop.fs.s3a.endpoint=http://minio.tfm-lakehouse.svc.cluster.local:9000
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# Credential injection (issue #93, Task 5): mounts minio-root-credentials'
# existing keys as env vars on executor pods, no new secret. The driver's
# own credentials are wired on the KubernetesPodOperator pod spec directly
# (see the no-op note above).
spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID=minio-root-credentials:root-user
spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY=minio-root-credentials:root-password

# RBAC and image (issue #93, Task 2/4). Note authenticate.driver.serviceAccountName
# is also a driver-pod-spec property and therefore also a no-op in client
# mode (same reason as the credentials above) -- kept here as a harmless,
# accurate statement of intent, but the launcher pod's actual ServiceAccount
# is set via KubernetesPodOperator's service_account_name in the DAG file.
spark.kubernetes.authenticate.driver.serviceAccountName=spark
spark.kubernetes.container.image=tfm-lakehouse/spark-py:3.5.9-iceberg1.11.0
spark.kubernetes.container.image.pullPolicy=IfNotPresent
