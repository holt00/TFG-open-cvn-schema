[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-open-cvn-schema"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.26",
    "pydantic>=2.12.5",
    "pymupdf>=1.26",
]

[project.scripts]
open-cvn = "open_cvn_app.cli:main"

[dependency-groups]
codegen = [
    "xsdata-pydantic>=24.5",
    "xsdata[cli,lxml]>=26.2",
]
testing = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_cvn_app = ["templates/latex/*.jinja"]
